# Regenerate the FFI bindings with:  dart run ffigen --config ffigen.yaml
# (requires libclang; see https://pub.dev/packages/ffigen). The committed
# lib/panels/panes_dock_bindings.dart is the output of this config.
name: PanesDockBindings
description: FFI bindings to the native macOS dock helper (macos/Runner/panes_dock.h).
output: 'lib/panels/panes_dock_bindings.dart'
headers:
  entry-points:
    - 'macos/Runner/panes_dock.h'
functions:
  include:
    - 'panes_dock_.*'
preamble: |
  // Generated by package:ffigen from macos/Runner/panes_dock.h.
  // Symbols are resolved from the running executable (Swift @_cdecl).
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
  // ignore_for_file: type=lint
comments:
  style: any
  length: full
