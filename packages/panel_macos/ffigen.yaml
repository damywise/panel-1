# Regenerate the FFI bindings with:  dart run ffigen --config ffigen.yaml
# (requires libclang; see https://pub.dev/packages/ffigen). The committed
# lib/src/panel_macos_bindings.dart is the output of this config.
name: PanelMacosBindings
description: FFI bindings to the native macOS dock helper (src/panes_dock.h).
output: 'lib/src/panel_macos_bindings.dart'
headers:
  entry-points:
    - 'src/panes_dock.h'
functions:
  include:
    - 'panes_dock_.*'
preamble: |
  // Generated by package:ffigen from src/panes_dock.h.
  // Symbols are resolved from the plugin framework via DynamicLibrary.process().
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
  // ignore_for_file: type=lint
comments:
  style: any
  length: full
